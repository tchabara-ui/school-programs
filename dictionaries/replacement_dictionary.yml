# =============================================================================
# SFA｜誤変換辞書（replacement_dictionary.yml）
# =============================================================================
# 目的:
#   Limitless Pendantの音声認識ログに含まれる誤変換・表記ゆれを機械的に修正する。
#   scripts/clean_limitless_log.py がこのファイルを読み込み、
#   raw_form → correct_form の単純置換を行う。
#
# 運用ルール:
#   1. entries: に追加していくだけで辞書は拡張できる（コード変更不要）。
#   2. raw_form が correct_form と同一の項目は「保護語彙」。
#      音声認識や下流処理がこの語を誤って書き換えないよう固定するための
#      エントリであり、置換処理そのものには影響しない（no-opとして安全）。
#   3. 意味が確定できない誤変換は、この辞書に追加せず
#      SFA_Builder_v1.md 側の【認識不明】ルールに委ねること。
#      辞書は「機械的に断定できる」ものだけを登録する場所。
#   4. 同じ raw_form を複数登録しない。曖昧な場合は notes に文脈条件を書く。
#   5. 長い語から先にマッチさせる（クリーニングスクリプトが自動でソートする）。
#
# 追加方法:
#   - entries の末尾に1件追加するだけでよい。
#   - category は任意分類（人名/固有名詞/プログラム名/専門用語/一般語 等）。
#   - added / note は省略可。
# =============================================================================

version: 1

entries:
  - raw_form: "側達同時"
    correct_form: "啐啄同時"
    category: "専門用語"
    note: "禅語。ひなが卵の中から殻をつつく音(啐)と、親鳥が外から殻をつつく音(啄)が同時であることから、学びのタイミングの一致を指す中核概念。"

  - raw_form: "フラフー"
    correct_form: "フラフープ"
    category: "プログラム備品"

  - raw_form: "マシュマロリバー"
    correct_form: "マシュマロリバー"
    category: "プログラム名"
    note: "保護語彙。正しい表記のため置換不要だが、誤表記への揺れ防止として登録。"

  - raw_form: "八百一"
    correct_form: "八百一"
    category: "クライアント名"
    note: "保護語彙。クライアント企業名。匿名化が必要な場合は anonymization 機能側で別途マスキングする。"

  - raw_form: "御湯所"
    correct_form: "御湯所"
    category: "固有名詞"
    note: "保護語彙。表記揺れ防止。"

  - raw_form: "リミットレス"
    correct_form: "Limitless"
    category: "固有名詞"
    note: "Limitless Pendant（記録デバイス）のカタカナ音声認識表記。"

  - raw_form: "プロトタイプキッチン"
    correct_form: "Prototype Kitchen"
    category: "プログラム名"
    note: "研修プログラムの中核コンセプト名。定義は 07_lexicon/concept_lexicon.md を参照。"

  - raw_form: "まかない"
    correct_form: "まかない"
    category: "一般語"
    note: "保護語彙。飲食業クライアント文脈で頻出する語のため誤消去防止。"

  - raw_form: "ファシリテーション"
    correct_form: "ファシリテーション"
    category: "専門用語"
    note: "保護語彙。表記揺れ防止。"

# -----------------------------------------------------------------------------
